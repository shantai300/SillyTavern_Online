name: Keep Alive

on:
  schedule:
    # 每 10 分钟跑一次（UTC 时间）
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SillyTavern
        run: |
          echo "开始保活探测..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            -u "${{ secrets.TAVERN_USER }}:${{ secrets.TAVERN_PASS }}" \
            "${{ secrets.TAVERN_URL }}")
          echo "HTTP 状态码: $code"
          case "$code" in
            200|301|302|401)
              echo "✅ 服务正常响应"
              ;;
            *)
              echo "⚠️ 非预期状态码: $code（可能正在冷启动）"
              ;;
          esac
